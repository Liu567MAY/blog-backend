[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes（未使用导入等）
    "I",   # isort 导入排序
    "UP",  # pyupgrade 语法现代化
    "B",   # flake8-bugbear 常见缺陷
    "SIM", # flake8-simplify 简化建议
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的标准写法，B008 对其误报
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]